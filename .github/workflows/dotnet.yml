name: CourtBook .NET Build & Test

on:
  push:
    branches: [ "main", "develop", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore CourtBook.sln

    - name: Build solution
      run: dotnet build CourtBook.sln --no-restore -c Release

    - name: Run xUnit Test Suite
      run: dotnet test CourtBook.sln --no-build -c Release --verbosity normal
